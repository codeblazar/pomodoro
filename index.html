<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>FocusForge Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">FOCUSFORGE</p>
        <h1>Pomodoro by Peter Kenny</h1>
      </header>

      <section class="timer-card" aria-labelledby="phase-label">
        <p class="phase-label" id="phase-label" aria-live="polite">Work</p>

        <div
          class="progress-ring"
          role="progressbar"
          aria-label="Time remaining"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="100"
        >
          <svg class="progress-ring__svg" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="progress-ring__track" cx="50" cy="50" r="48"></circle>
            <circle class="progress-ring__progress" cx="50" cy="50" r="48" pathLength="100"></circle>
          </svg>
          <div class="progress-ring__inner">
            <p class="timer-display" id="timer-display">25:00</p>
            <p class="timer-caption">Ready when you are</p>
          </div>
        </div>

        <div class="timer-controls" aria-label="Timer controls">
          <button class="button button--primary" id="start-button" type="button" disabled>
            Start
          </button>
          <button class="button button--secondary" id="pause-button" type="button" disabled>
            Pause
          </button>
          <button class="button button--secondary" id="reset-button" type="button" disabled>
            Reset
          </button>
        </div>

        <p class="session-count">
          Completed sessions <span id="session-count">0</span>
        </p>
      </section>
    </main>
  </body>
</html>
